<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0c101a"/>
    </linearGradient>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1280" height="60" fill="url(#headerGrad2)"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="28" cy="30" r="6" fill="#ef4444"/>
  <circle cx="48" cy="30" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="30" r="6" fill="#10b981"/>

  <!-- Brand logo & Workspace -->
  <g transform="translate(100, 18)">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#8b5cf6"/>
    <path d="M7 12h10M12 7v10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="34" y="17" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="0.5">Trackle</text>
    <rect x="96" y="2" width="1" height="20" fill="#334155"/>
    <text x="110" y="16" fill="#94a3b8" font-size="13" font-family="monospace">trackgle.jseven.in</text>
    <rect x="250" y="2" width="70" height="20" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="258" y="16" fill="#a5b4fc" font-size="11" font-weight="600">Sprint 14</text>
  </g>

  <!-- Navigation items -->
  <g transform="translate(480, 22)">
    <text x="0" y="14" fill="#94a3b8" font-size="13">Sprint Board</text>
    <text x="110" y="14" fill="#a78bfa" font-size="13" font-weight="600">Timesheets</text>
    <rect x="110" y="26" width="76" height="2" fill="#8b5cf6"/>
    <text x="220" y="14" fill="#94a3b8" font-size="13">Backlog</text>
    <text x="310" y="14" fill="#94a3b8" font-size="13">Velocity Reports</text>
  </g>

  <!-- User profile -->
  <g transform="translate(1120, 16)">
    <circle cx="14" cy="14" r="14" fill="#312e81" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="7" y="18" fill="#c4b5fd" font-size="11" font-weight="bold">NP</text>
    <text x="38" y="18" fill="#f1f5f9" font-size="12" font-weight="600">Nirmal P.</text>
  </g>

  <!-- Main Content Header -->
  <rect x="0" y="60" width="1280" height="64" fill="#0c111d"/>
  <line x1="0" y1="124" x2="1280" y2="124" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(40, 78)">
    <text x="0" y="20" fill="#ffffff" font-size="20" font-weight="800">Weekly Timesheet: Nirmal Priyadarshan</text>
    <rect x="420" y="5" width="190" height="22" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="430" y="19" fill="#c7d2fe" font-size="11" font-family="monospace">Week 37 · Sep 08 – Sep 12</text>
  </g>

  <!-- Quick Action Submit -->
  <g transform="translate(1030, 76)">
    <rect x="0" y="0" width="210" height="34" rx="8" fill="#8b5cf6"/>
    <text x="22" y="22" fill="#ffffff" font-size="12" font-weight="700">Submit Week for Review →</text>
  </g>

  <!-- TELEMETRY SUMMARY CARDS -->
  <g transform="translate(40, 145)">
    <!-- Card 1: Hours Logged -->
    <rect x="0" y="0" width="370" height="110" rx="12" fill="#0e1326" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">HOURS LOGGED (CURRENT WEEK)</text>
    <text x="20" y="70" fill="#ffffff" font-size="30" font-weight="800" font-family="monospace">38.5 <tspan font-size="16" fill="#94a3b8">/ 40.0h</tspan></text>
    <rect x="20" y="86" width="330" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="86" width="315" height="8" rx="4" fill="#8b5cf6"/>
    <text x="290" y="70" fill="#34d399" font-size="12" font-weight="bold">96% on track</text>

    <!-- Card 2: Active Task Stopwatch -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="410" height="110" rx="12" fill="#141829" stroke="#334155"/>
      <circle cx="30" cy="30" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="34" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="0.5">ACTIVE STOPWATCH RUNNING</text>
      <text x="20" y="60" fill="#ffffff" font-size="14" font-weight="700">#TRK-108: AI-Assisted Scaffolding</text>
      <rect x="20" y="70" width="130" height="28" rx="6" fill="#1e1338" stroke="#8b5cf6"/>
      <text x="32" y="89" fill="#c4b5fd" font-size="14" font-family="monospace" font-weight="bold">⏱ 02:25:40</text>
      <rect x="160" y="70" width="70" height="28" rx="6" fill="#7c3aed"/>
      <text x="175" y="88" fill="#ffffff" font-size="11" font-weight="bold">Pause</text>
    </g>

    <!-- Card 3: Sprint Velocity -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="360" height="110" rx="12" fill="#0d1322" stroke="#1e293b"/>
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">BILLABLE EFFICIENCY</text>
      <text x="20" y="70" fill="#ffffff" font-size="30" font-weight="800" font-family="monospace">100% <tspan font-size="14" fill="#34d399">Billable</tspan></text>
      <text x="20" y="94" fill="#64748b" font-size="12">0h Non-billable · 0h Overtime</text>
    </g>
  </g>

  <!-- TIMESHEET MATRIX TABLE -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="1200" height="400" rx="14" fill="#0d1322" stroke="#1e293b"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="1200" height="46" rx="14" fill="#141a29"/>
    <text x="24" y="28" fill="#94a3b8" font-size="12" font-weight="700">TASK / PROJECT NAME</text>
    <text x="440" y="28" fill="#94a3b8" font-size="12" font-weight="700">SPRINT</text>
    <text x="560" y="28" fill="#94a3b8" font-size="12" font-weight="700">MON 08</text>
    <text x="670" y="28" fill="#94a3b8" font-size="12" font-weight="700">TUE 09</text>
    <text x="780" y="28" fill="#94a3b8" font-size="12" font-weight="700">WED 10</text>
    <text x="890" y="28" fill="#94a3b8" font-size="12" font-weight="700">THU 11</text>
    <text x="1000" y="28" fill="#94a3b8" font-size="12" font-weight="700">FRI 12</text>
    <text x="1110" y="28" fill="#a78bfa" font-size="12" font-weight="800">TOTAL</text>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1: TRK-108 (Active) -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="1200" height="70" fill="#12182b"/>
      <rect x="0" y="0" width="4" height="70" fill="#8b5cf6"/>
      <text x="24" y="32" fill="#ffffff" font-size="14" font-weight="700">#TRK-108: AI-Assisted Scaffolding</text>
      <text x="24" y="52" fill="#94a3b8" font-size="11">Timesheet drag &amp; drop state machines · In-card timer</text>
      <rect x="440" y="24" width="70" height="20" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="448" y="38" fill="#c7d2fe" font-size="10" font-family="monospace">Sprint 14</text>
      
      <text x="565" y="40" fill="#cbd5e1" font-size="13" font-family="monospace">4.0h</text>
      <text x="675" y="40" fill="#cbd5e1" font-size="13" font-family="monospace">6.0h</text>
      <text x="785" y="40" fill="#cbd5e1" font-size="13" font-family="monospace">5.0h</text>
      <text x="895" y="40" fill="#cbd5e1" font-size="13" font-family="monospace">4.5h</text>
      <rect x="990" y="20" width="65" height="30" rx="6" fill="#2e1065" stroke="#8b5cf6"/>
      <text x="1000" y="40" fill="#e9d5ff" font-size="13" font-family="monospace" font-weight="bold">3.0h*</text>
      <text x="1115" y="40" fill="#a78bfa" font-size="15" font-family="monospace" font-weight="800">22.5h</text>
      <line x1="0" y1="70" x2="1200" y2="70" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 2: TRK-104 -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="1200" height="65" fill="#0d1322"/>
      <text x="24" y="30" fill="#f1f5f9" font-size="13" font-weight="600">#TRK-104: Timesheet Aggregator API</text>
      <text x="24" y="48" fill="#64748b" font-size="11">Automated Friday aggregation pipeline</text>
      <rect x="440" y="22" width="70" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="448" y="36" fill="#94a3b8" font-size="10" font-family="monospace">Sprint 14</text>
      
      <text x="565" y="38" fill="#cbd5e1" font-size="13" font-family="monospace">3.5h</text>
      <text x="675" y="38" fill="#cbd5e1" font-size="13" font-family="monospace">2.0h</text>
      <text x="785" y="38" fill="#cbd5e1" font-size="13" font-family="monospace">3.0h</text>
      <text x="895" y="38" fill="#cbd5e1" font-size="13" font-family="monospace">3.5h</text>
      <text x="1005" y="38" fill="#cbd5e1" font-size="13" font-family="monospace">4.0h</text>
      <text x="1115" y="38" fill="#f1f5f9" font-size="14" font-family="monospace" font-weight="700">16.0h</text>
      <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 3: Total Row -->
    <g transform="translate(0, 181)">
      <rect x="0" y="0" width="1200" height="50" fill="#141a29"/>
      <text x="24" y="32" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.5">DAILY TOTALS</text>
      <text x="565" y="32" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">7.5h</text>
      <text x="675" y="32" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">8.0h</text>
      <text x="785" y="32" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">8.0h</text>
      <text x="895" y="32" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">8.0h</text>
      <text x="1005" y="32" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">7.0h</text>
      <text x="1115" y="32" fill="#34d399" font-size="16" font-family="monospace" font-weight="800">38.5h</text>
    </g>
  </g>
</svg>
